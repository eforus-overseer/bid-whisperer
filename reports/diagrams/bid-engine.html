<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>From bid request to a price · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #fcfcfb;
      --color-ink:     #0b0b0b;
      --color-muted:   #52514e;
      --color-accent:  #2a78d6;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · bid-whisperer</p>
    <h1>From bid request to a price, in one lookup</h1>

    <svg viewBox="0 0 1000 584" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bid-engine-title bid-engine-desc">
      <title id="bid-engine-title">From bid request to a price, in one lookup</title>
      <desc id="bid-engine-desc">Architecture diagram of the pre-bid pricing engine: a bid request carrying url, ad slot and auction type is priced by a shrinkage blender that reads precomputed clearing-price quantile tables at the url, ad-slot, domain and global levels, and the resulting CPM is returned to the ad exchange.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52514e"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2a78d6"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6834"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#fcfcfb"/>

      <!-- Zone: precomputed quantile tables (drawn before arrows and nodes) -->
      <rect x="232" y="80" width="680" height="112" rx="8" fill="rgba(11,11,11,0.02)" stroke="rgba(11,11,11,0.10)" stroke-width="0.8"/>
      <rect x="420" y="84" width="304" height="12" rx="2" fill="#fcfcfb"/>
      <text x="572" y="93" fill="rgba(11,11,11,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CLEARING-PRICE QUANTILE TABLES · PER AUCTION TYPE</text>

      <!-- Arrows first (behind boxes). Tables feed the blender through fanned attach points 40 px apart. -->
      <!-- URL table -> blender (outer left, lower corridor) -->
      <path d="M320,176 V224 Q320,232 328,232 H512 Q520,232 520,240 V288" fill="none" stroke="#52514e" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Ad-slot table -> blender (inner left, upper corridor) -->
      <path d="M488,176 V200 Q488,208 496,208 H552 Q560,208 560,216 V288" fill="none" stroke="#52514e" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Domain table -> blender (inner right, upper corridor) -->
      <path d="M656,176 V200 Q656,208 648,208 H608 Q600,208 600,216 V288" fill="none" stroke="#52514e" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Global table -> blender (outer right, lower corridor) -->
      <path d="M824,176 V224 Q824,232 816,232 H648 Q640,232 640,240 V288" fill="none" stroke="#52514e" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Request -> blender -->
      <line x1="184" y1="320" x2="480" y2="320" stroke="#52514e" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Blender -> bid (the primary flow) -->
      <line x1="680" y1="320" x2="744" y2="320" stroke="#2a78d6" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Bid -> exchange (external response) -->
      <line x1="816" y1="352" x2="816" y2="424" stroke="#eb6834" stroke-width="1.2" marker-end="url(#arrow-link)"/>

      <!-- Arrow labels (masked, 8 px clear of their connector) -->
      <rect x="284" y="300" width="96" height="12" rx="2" fill="#fcfcfb"/>
      <text x="332" y="309" fill="#52514e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">URL · SLOT · TYPE</text>

      <rect x="696" y="300" width="32" height="12" rx="2" fill="#fcfcfb"/>
      <text x="712" y="309" fill="#2a78d6" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">Q(X)</text>

      <rect x="826" y="380" width="80" height="12" rx="2" fill="#fcfcfb"/>
      <text x="866" y="389" fill="#eb6834" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BID RESPONSE</text>

      <!-- Node: URL table (store) -->
      <rect x="248" y="112" width="144" height="64" rx="6" fill="#fcfcfb"/>
      <rect x="248" y="112" width="144" height="64" rx="6" fill="rgba(11,11,11,0.05)" stroke="#52514e" stroke-width="1"/>
      <rect x="256" y="120" width="28" height="12" rx="2" fill="transparent" stroke="rgba(82,81,78,0.50)" stroke-width="0.8"/>
      <text x="270" y="129" fill="#52514e" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TBL</text>
      <text x="320" y="148" fill="#0b0b0b" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">URL table</text>
      <text x="320" y="164" fill="#52514e" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">quantiles · n by url</text>

      <!-- Node: Ad-slot table (store) -->
      <rect x="416" y="112" width="144" height="64" rx="6" fill="#fcfcfb"/>
      <rect x="416" y="112" width="144" height="64" rx="6" fill="rgba(11,11,11,0.05)" stroke="#52514e" stroke-width="1"/>
      <rect x="424" y="120" width="28" height="12" rx="2" fill="transparent" stroke="rgba(82,81,78,0.50)" stroke-width="0.8"/>
      <text x="438" y="129" fill="#52514e" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TBL</text>
      <text x="488" y="148" fill="#0b0b0b" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ad-slot table</text>
      <text x="488" y="164" fill="#52514e" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">quantiles · n by slot</text>

      <!-- Node: Domain table (store) -->
      <rect x="584" y="112" width="144" height="64" rx="6" fill="#fcfcfb"/>
      <rect x="584" y="112" width="144" height="64" rx="6" fill="rgba(11,11,11,0.05)" stroke="#52514e" stroke-width="1"/>
      <rect x="592" y="120" width="28" height="12" rx="2" fill="transparent" stroke="rgba(82,81,78,0.50)" stroke-width="0.8"/>
      <text x="606" y="129" fill="#52514e" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TBL</text>
      <text x="656" y="148" fill="#0b0b0b" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Domain table</text>
      <text x="656" y="164" fill="#52514e" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">quantiles · n by domain</text>

      <!-- Node: Global table (store) -->
      <rect x="752" y="112" width="144" height="64" rx="6" fill="#fcfcfb"/>
      <rect x="752" y="112" width="144" height="64" rx="6" fill="rgba(11,11,11,0.05)" stroke="#52514e" stroke-width="1"/>
      <rect x="760" y="120" width="28" height="12" rx="2" fill="transparent" stroke="rgba(82,81,78,0.50)" stroke-width="0.8"/>
      <text x="774" y="129" fill="#52514e" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TBL</text>
      <text x="824" y="148" fill="#0b0b0b" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Global table</text>
      <text x="824" y="164" fill="#52514e" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fallback · all slots</text>

      <!-- Node: Bid request (input) -->
      <rect x="40" y="288" width="144" height="64" rx="6" fill="#fcfcfb"/>
      <rect x="40" y="288" width="144" height="64" rx="6" fill="rgba(82,81,78,0.10)" stroke="#898781" stroke-width="1"/>
      <rect x="48" y="296" width="28" height="12" rx="2" fill="transparent" stroke="rgba(137,135,129,0.50)" stroke-width="0.8"/>
      <text x="62" y="305" fill="#898781" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REQ</text>
      <text x="112" y="324" fill="#0b0b0b" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bid request</text>
      <text x="112" y="340" fill="#52514e" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">url · ad_slot · auction</text>

      <!-- Node: Shrinkage blender (focal) -->
      <rect x="480" y="288" width="200" height="64" rx="6" fill="#fcfcfb"/>
      <rect x="480" y="288" width="200" height="64" rx="6" fill="rgba(42,120,214,0.08)" stroke="#2a78d6" stroke-width="1"/>
      <rect x="488" y="296" width="36" height="12" rx="2" fill="transparent" stroke="rgba(42,120,214,0.50)" stroke-width="0.8"/>
      <text x="506" y="305" fill="#2a78d6" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MODEL</text>
      <text x="580" y="324" fill="#0b0b0b" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Shrinkage blender</text>
      <text x="580" y="340" fill="#52514e" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">weight = n / (n + 30)</text>

      <!-- Node: Bid (backend / output) -->
      <rect x="744" y="288" width="144" height="64" rx="6" fill="#fcfcfb"/>
      <rect x="744" y="288" width="144" height="64" rx="6" fill="#ffffff" stroke="#0b0b0b" stroke-width="1"/>
      <rect x="752" y="296" width="28" height="12" rx="2" fill="transparent" stroke="rgba(11,11,11,0.40)" stroke-width="0.8"/>
      <text x="766" y="305" fill="#0b0b0b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUT</text>
      <text x="816" y="324" fill="#0b0b0b" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bid for win rate X</text>
      <text x="816" y="340" fill="#52514e" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">CPM = blended Q(X)</text>

      <!-- Node: Ad exchange (external) -->
      <rect x="744" y="424" width="144" height="64" rx="6" fill="#fcfcfb"/>
      <rect x="744" y="424" width="144" height="64" rx="6" fill="rgba(11,11,11,0.03)" stroke="rgba(11,11,11,0.30)" stroke-width="1"/>
      <rect x="752" y="432" width="28" height="12" rx="2" fill="transparent" stroke="rgba(11,11,11,0.22)" stroke-width="0.8"/>
      <text x="766" y="441" fill="#898781" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="816" y="460" fill="#0b0b0b" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ad exchange</text>
      <text x="816" y="476" fill="#52514e" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">first or second price</text>

      <!-- Legend strip -->
      <line x1="40" y1="520" x2="960" y2="520" stroke="rgba(11,11,11,0.10)" stroke-width="0.8"/>
      <text x="40" y="536" fill="#52514e" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="548" width="14" height="10" rx="2" fill="rgba(42,120,214,0.08)" stroke="#2a78d6" stroke-width="1"/>
      <text x="60" y="556" fill="#52514e" font-size="8.5" font-family="'Geist', sans-serif">Focal · the model</text>

      <rect x="164" y="548" width="14" height="10" rx="2" fill="rgba(11,11,11,0.05)" stroke="#52514e" stroke-width="1"/>
      <text x="184" y="556" fill="#52514e" font-size="8.5" font-family="'Geist', sans-serif">Store · precomputed table</text>

      <rect x="332" y="548" width="14" height="10" rx="2" fill="rgba(82,81,78,0.10)" stroke="#898781" stroke-width="1"/>
      <text x="352" y="556" fill="#52514e" font-size="8.5" font-family="'Geist', sans-serif">Input</text>

      <rect x="404" y="548" width="14" height="10" rx="2" fill="#ffffff" stroke="#0b0b0b" stroke-width="1"/>
      <text x="424" y="556" fill="#52514e" font-size="8.5" font-family="'Geist', sans-serif">Output</text>

      <rect x="484" y="548" width="14" height="10" rx="2" fill="rgba(11,11,11,0.03)" stroke="rgba(11,11,11,0.30)" stroke-width="1"/>
      <text x="504" y="556" fill="#52514e" font-size="8.5" font-family="'Geist', sans-serif">External</text>

      <line x1="572" y1="554" x2="600" y2="554" stroke="#2a78d6" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="608" y="556" fill="#52514e" font-size="8.5" font-family="'Geist', sans-serif">Primary flow</text>

      <line x1="692" y1="554" x2="720" y2="554" stroke="#eb6834" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="728" y="556" fill="#52514e" font-size="8.5" font-family="'Geist', sans-serif">Response to the exchange</text>

      <text x="876" y="556" fill="#52514e" font-size="8.5" font-family="'Instrument Serif', serif" font-style="italic">O(1) per request.</text>
    </svg>
  </div>
</body>
</html>
